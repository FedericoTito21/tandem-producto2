<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tándem – Iniciar sesión</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">Tándem</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menu" aria-controls="menu" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="exchanges.html">Intercambios</a></li>
          <li class="nav-item"><a class="nav-link" href="users.html">Usuarios</a></li>
        </ul>
        <span class="navbar-text me-3" id="usuarioActivo">-no login-</span>
        <a class="btn btn-light btn-sm" href="login.html">Iniciar sesión</a>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <h1 class="h3 mb-3">Iniciar sesión</h1>
        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email" required>
            <div class="invalid-feedback">Escribe un correo válido.</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required>
            <div class="invalid-feedback">La contraseña es obligatoria.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="loginButton">Entrar</button>
        </form>
        <p class="text-muted small mt-3">Usuarios de ejemplo: laura@tandem.com / 1234</p>
      </div>
    </div>
  </main>
  <footer class="text-center text-muted py-3 small">
    Tándem · Proyecto FP066 · Producto 2
  </footer>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
