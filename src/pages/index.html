<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tándem – Dashboard</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">Tándem</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menu" aria-controls="menu" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="exchanges.html">Intercambios</a></li>
          <li class="nav-item"><a class="nav-link" href="users.html">Usuarios</a></li>
        </ul>
        <span class="navbar-text me-3" id="usuarioActivo">-no login-</span>
        <a class="btn btn-light btn-sm" href="login.html">Iniciar sesión</a>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <h1 class="h3 text-center mb-3">Dashboard de Intercambios de Idiomas</h1>
    <div id="aviso-dashboard" role="status"></div>
    <div class="text-center mb-4" role="group" aria-label="Filtrar por tipo">
      <button type="button" class="btn btn-outline-secondary btn-sm active" data-filtro="todos">Todos</button>
      <button type="button" class="btn btn-outline-success btn-sm" data-filtro="Ofrezco idioma">Ofrezco idioma</button>
      <button type="button" class="btn btn-outline-warning btn-sm" data-filtro="Busco idioma">Busco idioma</button>
    </div>
    <div class="row g-4">
      <section class="col-12 col-lg-6" aria-labelledby="t-origen">
        <h2 id="t-origen" class="h5">Intercambios <span class="badge text-bg-secondary" id="contador-origen">0</span></h2>
        <div id="zona-origen" class="zona-soltar" aria-label="Intercambios disponibles"></div>
      </section>
      <section class="col-12 col-lg-6" aria-labelledby="t-seleccion">
        <h2 id="t-seleccion" class="h5">Mi selección <span class="badge text-bg-primary" id="contador-seleccion">0</span></h2>
        <div id="zona-seleccion" class="zona-soltar" aria-label="Intercambios seleccionados"></div>
      </section>
    </div>
  </main>
  <footer class="text-center text-muted py-3 small">
    Tándem · Proyecto FP066 · Producto 2
  </footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script type="module" src="../js/int_1_dashboard.js"></script>
</body>
</html>
